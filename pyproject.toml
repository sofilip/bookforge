[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bookforge"
version = "0.1.0"
description = "Universal automated book publishing pipeline: dual-engine OCR, linguistic second-auditor proofreader, and zero-overflow PDF/EPUB typesetting."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.15"
authors = [
    { name = "BookForge Contributors" }
]
keywords = [
    "publishing",
    "ebook",
    "typesetting",
    "latex",
    "xelatex",
    "epub",
    "ocr",
    "tesseract",
    "proofreading",
    "typography"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Text Processing :: Markup :: LaTeX",
    "Topic :: Scientific/Engineering :: Image Recognition"
]

dependencies = [
    "pymupdf>=1.23.0"
]

[project.scripts]
bookforge = "bookforge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["bookforge"]

